<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karigar admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="onboard"><section class="onboard-card"><div class="brand"><span class="brand-mark">K</span> karigar admin</div><div class="eyebrow">CONTROL PLANE</div><h1>Commercial overview</h1><p id="message">Loading platform metadata...</p><div id="metrics" class="grid stats"></div><div id="tenants" class="list"></div></section></main><script type="module">const out=document.querySelector('#message'),metrics=document.querySelector('#metrics'),tenants=document.querySelector('#tenants');const headers={'x-admin-key':prompt('Admin key','local-admin')||''};try{const [a,t]=await Promise.all([fetch('/api/admin/overview',{headers}),fetch('/api/admin/tenants',{headers})]);if(!a.ok)throw Error((await a.json()).error);const overview=await a.json(),rows=await t.json();out.textContent='Platform metadata only. Customer ledger data is not shown here.';metrics.innerHTML=[['Tenants',overview.totalTenants],['Paid',overview.activeSubscriptions],['Trials',overview.trials],['MRR',`INR ${overview.mrr.toLocaleString('en-IN')}`]].map(([label,value])=>`<div class="card"><span class="stat-label">${label}</span><div class="stat-value">${value}</div></div>`).join('');tenants.innerHTML=rows.map(x=>`<div class="row"><div><strong>${x.businessName}</strong><small>${x.ownerUserId}</small></div><span class="pill">${x.subscriptionStatus}</span></div>`).join('')||'<div class="empty">No tenants yet.</div>'}catch(e){out.textContent=e.message}</script></body></html>
